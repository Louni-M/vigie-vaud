# Mises à jour des dépendances : actions des workflows (épinglées par SHA, version en commentaire, que Dependabot
# tient à jour ensemble ; tests/test_workflows.py dans pipeline/), dépendances npm du site (pnpm) et uv du pipeline.
# Une PR groupée par écosystème et par semaine pour les versions mineures et correctives ; une PR par version majeure,
# qui demande souvent une adaptation. Une version n'est proposée qu'une semaine après sa publication (`cooldown`),
# le temps qu'une version compromise soit retirée.
version: 2
updates:
  # À un dossier autre que la racine, Dependabot lit les workflows posés dans ce dossier même : le déclencheur modèle
  # du dépôt de données est donc surveillé aussi.
  - package-ecosystem: github-actions
    directories:
      - /
      - /pipeline/depot-donnees/.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pipeline:
        patterns: ['*']
        update-types: [minor, patch]
