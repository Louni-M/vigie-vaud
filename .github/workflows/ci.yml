name: Contrôles des PR

# Chaîne de contrôles de chaque PR, que les tickets suivants complètent (tests, schéma commun…).
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Tests (Vitest)
        run: pnpm test

      # La construction échoue si sources.json est invalide ou cite un n° OFS hors des communes actuelles.
      - name: Construire le site
        run: pnpm build

      - name: Vérifier qu'aucune donnée CAMAC ni DGMR n'est dans le site construit
        working-directory: .
        run: .github/scripts/verifier-sans-rediffusion.sh web/build

  # Schéma commun (ADR 0013) : les modèles Pydantic sont la seule source. Le JSON Schema et les types TypeScript
  # versionnés doivent être ceux qu'une nouvelle génération produit.
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Installer les dépendances
        run: |
          uv sync --locked --project pipeline
          pnpm --dir web install --frozen-lockfile

      - name: Régénérer le schéma et les types
        run: pnpm --dir web schema

      - name: Vérifier que rien n'a changé
        run: |
          if [ -n "$(git status --porcelain -- schema web/src/lib/schema.ts)" ]; then
            git status --short -- schema web/src/lib/schema.ts
            git diff -- schema web/src/lib/schema.ts
            echo "Schéma commun périmé : lancer « pnpm --dir web schema » et versionner le résultat" >&2
            exit 1
          fi

  pipeline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
      - name: Installer les dépendances
        run: uv sync --locked

      - name: pytest
        run: uv run pytest
