name: Publication du site (API en direct)

# Prototype « API en direct » : aucune donnée CAMAC n'est téléchargée, construite ni publiée.
# Le navigateur des visiteurs interroge lui-même ogc.vd.ch ; seul le site statique est déployé.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Vérifier qu'aucune donnée CAMAC n'est publiée
        run: |
          if [ -e web/build/data ]; then echo "web/build/data ne doit pas exister" && exit 1; fi

      - if: vars.PUBLIER == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build
      - if: vars.PUBLIER == 'true'
        uses: actions/deploy-pages@v4
