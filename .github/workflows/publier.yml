name: Publication du site

# Construit le site statique et le publie sur GitHub Pages. Aucune donnée CAMAC ni DGMR n'est téléchargée,
# construite ni publiée : le navigateur des visiteurs interroge lui-même www.ogc.vd.ch (norme DCG 8401).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Installer les dépendances
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Contrôles du site avant toute construction : un échec arrête le job avant le déploiement.
      - name: svelte-check
        working-directory: web
        run: pnpm check

      - name: Tests (Vitest)
        working-directory: web
        run: pnpm test

      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: pnpm build

      - name: Vérifier qu'aucune donnée CAMAC ni DGMR n'est publiée
        run: .github/scripts/verifier-sans-rediffusion.sh web/build

      - if: vars.PUBLIER == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/build
      - if: vars.PUBLIER == 'true'
        uses: actions/deploy-pages@v5
