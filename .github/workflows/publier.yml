name: Publication du site (API en direct)

# Prototype « API en direct » : aucune donnée CAMAC n'est téléchargée, construite ni publiée.
# Le navigateur des visiteurs interroge lui-même ogc.vd.ch ; seul le site statique est déployé.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Construire le site
        working-directory: web
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Vérifier qu'aucune donnée CAMAC ni DGMR n'est publiée
        run: .github/scripts/verifier-sans-rediffusion.sh web/build

      - if: vars.PUBLIER == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/build
      - if: vars.PUBLIER == 'true'
        uses: actions/deploy-pages@v5
