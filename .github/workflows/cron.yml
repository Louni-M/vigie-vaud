name: Passage du cron

# Workflow réutilisable (ADR 0014). Il n'est lancé que par le déclencheur du dépôt de données `vigie-vaud-donnees`,
# dont le contenu est dans `pipeline/depot-donnees/.github/workflows/cron.yml`. Il tourne donc avec le
# `GITHUB_TOKEN` du dépôt de données, avec pour seul secret `RETRAITS_CLE` (facultatif, ADR 0007), et `github.repository`
# y désigne le dépôt de données.
# Un passage : sondes et état des sources, import quotidien des conseils dus (`pipeline/cron.py`), avec un commit
# qui sert d'archive et un push (`pull --rebase` et deux nouveaux essais au plus) après chaque phase (sondes,
# OpenParlData, sites des communes), puis publication du dépôt de données sur Pages. Lancé à la main depuis le déclencheur, l'entrée `rattrapage` importe tous les conseils d'OpenParlData depuis
# tout l'historique, sans toucher aux sites des communes ; l'entrée `rattrapage_cible` (une plateforme, `i-web`, ou le
# n° OFS d'une commune scrapée) rouvre toutes les pages des sites visés, sans plafond, au même débit (ADR 0010).
on:
  workflow_call:
    inputs:
      rattrapage:
        description: Importer tous les conseils d'OpenParlData depuis tout l'historique
        type: boolean
        default: false
      rattrapage_cible:
        description: Plateforme (i-web) ou n° OFS d'une commune scrapée dont relire tout le site
        type: string
        default: ''
    secrets:
      RETRAITS_CLE:
        description: Clé des empreintes des retraits (ADR 0007)
        required: false

jobs:
  passage:
    runs-on: ubuntu-24.04
    # Un passage ordinaire sonde et importe au plus un jour de changements, sites des communes compris (l'étape
    # « Passage du cron » a duré jusqu'à 35 minutes du 15 octobre au 13 novembre 2026, à 5 s par requête), et laisse
    # jusqu'à 16 minutes aux deux essais de publication sur Pages, attentes de l'artefact comprises : il reste 15
    # minutes de marge quand Pages publie en quelques secondes, presque rien quand ses deux essais vont jusqu'à leur
    # délai. Chaque phase étant poussée dès sa fin, un dépassement ne perd que la phase en cours ; Pages attend alors
    # le passage suivant. Un rattrapage relit tout l'historique d'OpenParlData ou des sites visés (une à deux heures pour une
    # plateforme). 360 minutes est le plus long délai d'un job hébergé par GitHub.
    timeout-minutes: ${{ (inputs.rattrapage || inputs.rattrapage_cible != '') && 360 || 51 }}
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement-2.outputs.page_url }}
    steps:
      - name: Cloner le dépôt de données
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: donnees

      # Le code du cron est cloné au commit même de ce workflow : celui où le déclencheur l'a appelé
      # (`cron.yml@cron`, voir la README, « Branche cron »). `job.workflow_*` désigne le fichier qui définit le job, ce
      # workflow réutilisable, alors que `github.*` désigne ici le déclencheur et le dépôt de données. Le déclencheur
      # reste ainsi le seul à nommer la référence. Une valeur vide ferait cloner la branche par défaut, `main` : la
      # vérification ci-dessous arrête le passage avant.
      - name: Vérifier le commit du workflow
        env:
          DEPOT: ${{ job.workflow_repository }}
          COMMIT: ${{ job.workflow_sha }}
        run: |
          if [ -z "$DEPOT" ] || [ -z "$COMMIT" ]; then
            echo "::error::job.workflow_repository ou job.workflow_sha est vide : le code du cron ne serait pas celui de l'appel"
            exit 1
          fi
          echo "Code du cron : $DEPOT@$COMMIT"
      - name: Cloner le code du cron
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: code
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Les dépendances du projet seules : ni `dev` ni `geo` (pile géographique de la préparation des communes).
      - name: Installer le pipeline
        run: uv sync --locked --no-dev --project code/pipeline

      # Les issues `panne-source`, `import-conseils` et `a-verifier` s'ouvrent dans le dépôt de données (`GITHUB_REPOSITORY`,
      # celui du déclencheur) avec son `GITHUB_TOKEN`, que `cron.py` lit dans l'environnement.
      - name: Passage du cron
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # La cible passe par l'environnement, jamais dans le script lui-même : c'est un texte saisi à la main.
          RATTRAPAGE_CIBLE: ${{ inputs.rattrapage_cible }}
          RETRAITS_CLE: ${{ secrets.RETRAITS_CLE }}
        run: >-
          uv run --no-dev --project code/pipeline python code/pipeline/cron.py --depot donnees
          ${{ inputs.rattrapage && '--rattrapage' || '' }}
          ${RATTRAPAGE_CIBLE:+--rattrapage-cible "$RATTRAPAGE_CIBLE"}

      # `upload-pages-artifact` laisse de côté `.git`, `.github` et, depuis sa v4, tout fichier caché.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: donnees
      # Un artefact finalisé n'est pas tout de suite listé pour le run : au passage du 21 novembre 2026,
      # `deploy-pages` le cherchait 0,3 s après son envoi et ne le trouvait pas (« No artifacts named »), alors
      # qu'il l'était 2,4 s après. `deploy-pages` le cherche avec le jeton interne du runner, qu'une étape `run` n'a
      # pas : on attend donc un temps fixe, bien au-delà du retard constaté, plutôt que d'interroger une autre API
      # qui pourrait le voir plus tôt.
      - name: Laisser l'artefact apparaître
        run: sleep 10
      # Un déploiement prend d'ordinaire quelques secondes, mais Pages en laisse parfois un bloqué sur
      # `syncing_files` jusqu'au délai de `deploy-pages` (passages des 6 et 7 novembre 2026), alors que le suivant
      # passe. Le premier essai abandonne donc après 5 minutes (et annule son déploiement), puis un second essai
      # repart d'un artefact neuf avec le délai par défaut de 10 minutes : sans lui, le site attendrait le prochain
      # passage planifié, parfois plusieurs heures, alors que le commit d'archive est déjà poussé. Le second essai
      # rattrape aussi un artefact encore introuvable, après une attente plus longue : c'est la dernière chance.
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
        with:
          timeout: 300000
      - if: steps.deploiement.outcome == 'failure'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: donnees
          name: github-pages-2
      - name: Laisser le second artefact apparaître
        if: steps.deploiement.outcome == 'failure'
        run: sleep 45
      - id: deploiement-2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-2
