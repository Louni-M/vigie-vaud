name: Passage du cron

# Workflow réutilisable (ADR 0014). Il n'est lancé que par le déclencheur du dépôt de données `vigie-vaud-donnees`,
# dont le contenu est dans `pipeline/depot-donnees/.github/workflows/cron.yml`. Il tourne donc avec le
# `GITHUB_TOKEN` du dépôt de données, sans aucun secret, et `github.repository` y désigne le dépôt de données.
# Un passage : sondes et état des sources, import quotidien des conseils dus (`pipeline/cron.py`), commit qui sert
# d'archive, push (avec `pull --rebase` et deux nouveaux essais au plus), puis publication du dépôt de données sur
# Pages. L'entrée `rattrapage` (lancement manuel du déclencheur) importe tous les conseils depuis tout l'historique.
on:
  workflow_call:
    inputs:
      rattrapage:
        description: Importer tous les conseils depuis tout l'historique
        type: boolean
        default: false

jobs:
  passage:
    runs-on: ubuntu-24.04
    # Un passage ordinaire sonde et importe au plus un jour de changements ; le rattrapage relit tout l'historique
    # à une requête par seconde.
    timeout-minutes: ${{ inputs.rattrapage && 360 || 20 }}
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Cloner le dépôt de données
        uses: actions/checkout@v4
        with:
          path: donnees

      # Le dépôt principal, à la même branche que l'appel `cron.yml@main` du déclencheur. Son adresse est aussi
      # dans `config.json` (`depot`), que ce workflow ne peut pas lire avant de l'avoir cloné.
      - name: Cloner le code du cron
        uses: actions/checkout@v4
        with:
          repository: Louni-M/vigie-vaud
          ref: main
          path: code
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
      - name: Installer le pipeline
        run: uv sync --locked --no-dev --project code/pipeline

      # Les issues `panne-source` et `import-conseils` s'ouvrent dans le dépôt de données (`GITHUB_REPOSITORY`,
      # celui du déclencheur) avec son `GITHUB_TOKEN`, que `cron.py` lit dans l'environnement.
      - name: Passage du cron
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          uv run --no-dev --project code/pipeline python code/pipeline/cron.py --depot donnees
          ${{ inputs.rattrapage && '--rattrapage' || '' }}

      # `upload-pages-artifact` laisse de côté `.git` et `.github`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: donnees
      - id: deploiement
        uses: actions/deploy-pages@v4
