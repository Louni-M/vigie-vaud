	<rect width="1200" height="630" fill="#1f3a5f"/>
	<g transform="translate(50 0)">
	<g fill="none" stroke="#3b5a82" stroke-width="2">
		<path d="M760 120 L900 90 L1040 150 L1110 260 L1080 400 L960 500 L820 520 L720 430 L690 300 Z"/>
