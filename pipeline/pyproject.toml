[project]
name = "pipeline"
version = "0.1.0"
description = "Préparation des données et cron de Vigie Vaud"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
